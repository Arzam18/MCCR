name: MCCR Rating Update

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Choose whether to initialize MCCR, add a new engine, or update an existing engine/version"
        required: true
        default: initial
        type: choice
        options: [initial, add, update]
      engine:
        description: "Exact engine player name in the uploaded PGN (required for add/update)"
        required: false
        type: string
      display_name:
        description: "Name to display in the MCCR rating list (required for add/update)"
        required: false
        type: string
      replace_existing:
        description: "For update only: exact current display name of the engine entry to replace"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: mccr-rating-update
  cancel-in-progress: false

jobs:
  calculate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout MCCR repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PGN parser
        run: python -m pip install --upgrade pip python-chess

      - name: Download and compile BayesElo
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 https://www.remi-coulom.fr/Bayesian-Elo/bayeselo.tar.bz2 -o /tmp/bayeselo.tar.bz2
          mkdir -p /tmp/bayeselo-src
          tar -xjf /tmp/bayeselo.tar.bz2 -C /tmp/bayeselo-src
          SOURCE="$(find /tmp/bayeselo-src -type f -name bayeselo.cpp -print -quit)"
          if [ -z "$SOURCE" ]; then
            echo "Could not find bayeselo.cpp in the official BayesElo source archive." >&2
            find /tmp/bayeselo-src -maxdepth 4 -type f -print >&2
            exit 1
          fi
          g++ -O2 -std=c++11 -Wall -Wextra "$SOURCE" -o /tmp/bayeselo
          sudo install -m 0755 /tmp/bayeselo /usr/local/bin/bayeselo
          printf '?\nx\n' | /usr/local/bin/bayeselo

      - name: Validate selected action and PGNs
        shell: bash
        env:
          ACTION_KIND: ${{ inputs.action }}
          ENGINE_NAME: ${{ inputs.engine }}
          DISPLAY_NAME: ${{ inputs.display_name }}
          REPLACE_EXISTING: ${{ inputs.replace_existing }}
        run: |
          set -euo pipefail
          if [ "$ACTION_KIND" != "initial" ]; then
            test -n "$ENGINE_NAME" || { echo "Enter the exact engine name used in the PGN." >&2; exit 1; }
            test -n "$DISPLAY_NAME" || { echo "Enter the display name for the MCCR table." >&2; exit 1; }
          fi
          if [ "$ACTION_KIND" = "update" ]; then
            test -n "$REPLACE_EXISTING" || { echo "For update, enter the existing display name to replace." >&2; exit 1; }
          fi
          if [ "$ACTION_KIND" = "initial" ]; then
            test -f pgn/initial.pgn || { echo "Initial action requires pgn/initial.pgn." >&2; exit 1; }
          else
            find pgn -type f -name '*.pgn' -print -quit | grep -q . || { echo "Upload the PGN under pgn/ before running this workflow." >&2; exit 1; }
          fi

      - name: Import games, calculate ratings, and publish
        env:
          MCCR_ACTION: ${{ inputs.action }}
          MCCR_ENGINE: ${{ inputs.engine }}
          MCCR_DISPLAY_NAME: ${{ inputs.display_name }}
          MCCR_REPLACE_EXISTING: ${{ inputs.replace_existing }}
          BAYESELO_BIN: /usr/local/bin/bayeselo
        run: python mccr_rating.py

      - name: Commit rating list and permanent game database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Force-add generated database files even if a repository .gitignore pattern
          # (for example *.jsonl) would otherwise hide them from Git.
          test -f ratings/games.jsonl || { echo "Expected cumulative database ratings/games.jsonl was not created by mccr_rating.py." >&2; exit 1; }
          git add -f index.html ratings/mccr_ratings.csv ratings/base_ratings.csv ratings/games.jsonl ratings/engine_aliases.json ratings/mccr_config.json
          if git diff --cached --quiet; then
            echo "No rating or database changes to commit."
          else
            git commit -m "Update MCCR ratings and cumulative game database"
            git push
          fi

      - name: Upload MCCR results
        uses: actions/upload-artifact@v4
        with:
          name: mccr-rating-results
          path: |
            index.html
            ratings/mccr_ratings.csv
            ratings/base_ratings.csv
            ratings/games.jsonl
            ratings/engine_aliases.json
            ratings/mccr_config.json
