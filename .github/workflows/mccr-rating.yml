name: MCCR Rating Update

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "initial = calculate the initial pool from pgn/initial.pgn; entrant = add one new engine from another PGN"
        required: true
        default: initial
        type: choice
        options: [initial, entrant]
      engine:
        description: "Optional exact PGN player name for the new entrant; leave blank to auto-detect"
        required: false
        type: string
  # PGN uploads trigger automatic calculation. Code/config changes are run manually
  # so a workflow update cannot accidentally recalculate the published list.
  push:
    paths:
      - "pgn/**/*.pgn"
      - "pgn/*.pgn"

permissions:
  contents: write

concurrency:
  group: mccr-rating-update
  cancel-in-progress: false

jobs:
  calculate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout MCCR repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PGN parser
        run: python -m pip install --upgrade pip python-chess

      - name: Download and compile official BayesElo
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 https://www.remi-coulom.fr/Bayesian-Elo/bayeselo.tar.bz2 -o /tmp/bayeselo.tar.bz2
          mkdir -p /tmp/bayeselo-src
          tar -xjf /tmp/bayeselo.tar.bz2 -C /tmp/bayeselo-src

          # The official archive provides the C++ source but does not include
          # a Makefile. Compile the source directly instead of searching for one.
          SOURCE="$(find /tmp/bayeselo-src -type f -name bayeselo.cpp -print -quit)"
          if [ -z "$SOURCE" ]; then
            echo "Could not find bayeselo.cpp in the official BayesElo source archive." >&2
            echo "Archive contents:" >&2
            find /tmp/bayeselo-src -maxdepth 3 -type f -print >&2
            exit 1
          fi

          g++ -O2 -std=c++11 -Wall -Wextra "$SOURCE" -o /tmp/bayeselo
          test -x /tmp/bayeselo
          sudo install -m 0755 /tmp/bayeselo /usr/local/bin/bayeselo

          # Smoke-test the command interpreter. Any compiler or runtime failure
          # stops the workflow before ratings can be published.
          printf '?\nx\n' | /usr/local/bin/bayeselo

      - name: Validate PGN files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import chess.pgn
          pgn_dir = Path("pgn")
          files = sorted(pgn_dir.rglob("*.pgn"))
          if not files:
              raise SystemExit("No PGN files under pgn/. Add pgn/initial.pgn.")
          total = 0
          for path in files:
              count = 0
              with path.open(encoding="utf-8", errors="replace") as f:
                  while True:
                      game = chess.pgn.read_game(f)
                      if game is None:
                          break
                      h = game.headers
                      if h.get("White") and h.get("Black") and h.get("White") != h.get("Black") and h.get("Result") in {"1-0", "0-1", "1/2-1/2"}:
                          count += 1
              print(f"{path}: {count} completed games")
              total += count
          if total == 0:
              raise SystemExit("No completed games with valid White/Black/Result tags found.")
          PY

      - name: Determine rating mode
        id: rating_mode
        shell: bash
        env:
          REQUESTED_MODE: ${{ inputs.mode || '' }}
          BEFORE_SHA: ${{ github.event.before || '' }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -n "$REQUESTED_MODE" ]; then
            MODE="$REQUESTED_MODE"
          elif [ ! -f ratings/base_ratings.csv ] || [ "$(wc -l < ratings/base_ratings.csv)" -le 1 ]; then
            MODE=initial
          elif [ -n "$BEFORE_SHA" ] && [[ ! "$BEFORE_SHA" =~ ^0+$ ]] && git diff --name-only "$BEFORE_SHA" "$CURRENT_SHA" | grep -qx 'pgn/initial.pgn'; then
            MODE=initial
          else
            MODE=entrant
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "Selected MCCR mode: $MODE"

      - name: Calculate BayesElo rating list
        env:
          MCCR_MODE: ${{ steps.rating_mode.outputs.mode }}
          MCCR_ENGINE: ${{ inputs.engine || '' }}
          MCCR_ANCHOR_ELO: "3200"
          BAYESELO_BIN: /usr/local/bin/bayeselo
        shell: bash
        run: |
          if [ -n "$MCCR_ENGINE" ]; then
            python mccr_rating.py --mode "$MCCR_MODE" --engine "$MCCR_ENGINE"
          else
            python mccr_rating.py --mode "$MCCR_MODE"
          fi

      - name: Commit generated ratings and frozen reference
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html ratings/mccr_ratings.csv ratings/base_ratings.csv
          if git diff --cached --quiet; then
            echo "No rating changes to commit."
          else
            git commit -m "Update MCCR BayesElo rating list"
            git push
          fi

      - name: Upload generated files
        uses: actions/upload-artifact@v4
        with:
          name: mccr-rating-results
          path: |
            index.html
            ratings/mccr_ratings.csv
            ratings/base_ratings.csv
